controller:
  host_alias: LABAHUAdeMacBook-Air-3
  mgmt_ip: 192.168.2.1
  notes: Mac control host on the wired 192.168.2.0/24 management subnet for SSH, rsync, and offline analysis.

devices:
  - id: pi2
    role: csi_tx
    ssh_host: pi@192.168.2.2
    mgmt_ip: 192.168.2.2
    ethernet_interface: eth0
    wifi_interface: wlan0
    sound_card: null
    notes: CSI transmitter. Keep wlan0 in managed client mode when using public Wi-Fi or a dedicated AP.

  - id: pi3
    role: csi_rx_env_audio
    ssh_host: pi@192.168.2.3
    mgmt_ip: 192.168.2.3
    ethernet_interface: eth0
    wifi_interface: wlan0
    sound_card: respeaker-2mic-hat-v2
    notes: Primary CSI receiver plus ReSpeaker environment-audio node.

  - id: pi4
    role: csi_rx_env_audio
    ssh_host: pi4@192.168.2.4
    mgmt_ip: 192.168.2.4
    ethernet_interface: eth0
    wifi_interface: wlan0
    sound_card: respeaker-2mic-hat-v2
    notes: Secondary CSI receiver plus ReSpeaker environment-audio node.

  - id: pi5
    role: lav_audio
    ssh_host: pi5@192.168.2.6
    mgmt_ip: 192.168.2.6
    ethernet_interface: eth0
    wifi_interface: wlan0
    sound_card: usb-x2
    notes: Personal lavalier node using two single-input USB sound cards on pi5.