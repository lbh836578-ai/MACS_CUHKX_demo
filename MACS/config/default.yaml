camera:
  nyx650:
    rgb:
      width: 1600
      height: 1200
      fps: 15
    depth:
      width: 640
      height: 480
      fps: 15
    ir:
      width: 640
      height: 480
      fps: 15

  tb4117:
    # Confirmed via diagnose.py: HikCamera maps to /dev/video0 on this Pi.
    # Fix to 0 to skip the slow auto-detect scan of bcm2835-isp nodes.
    device_index: 0
    thermal:
      # UVC descriptor reports 120x160 (width=120, height=160).
      # This is the actual sensor orientation reported by the firmware.
      width: 120
      height: 160
      fps: 25
      # MJPG: lower USB bandwidth, confirmed faster on this hardware
      pixelformat: "MJPG"

recording:
  output_dir: "data"
  raw_subdir: "raw"
  processed_subdir: "processed"
  save_format:
    RGB: "jpg"
    Depth: "npy"
    IR: "npy"
    Thermal: "jpg"
  jpg_quality: 95

health:
  fps_warn_ratio: 0.7
  frame_loss_threshold: 10
  sync_drift_threshold_ms: 66
  disk_min_gb: 1.0

ui:
  preview_width: 320
  preview_height: 240
  status_update_interval_ms: 500